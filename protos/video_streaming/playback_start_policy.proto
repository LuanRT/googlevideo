syntax = "proto2";
package video_streaming;

message PlaybackStartPolicy {
  message MinReadaheadPolicy {
    optional int32 min_readahead_ms = 2;
    optional int32 min_bandwidth_bytes_per_sec = 1;
  }

  optional MinReadaheadPolicy start_min_readahead_policy = 1;
  optional MinReadaheadPolicy resume_min_readahead_policy = 2;
  optional string video_id = 3;
  optional int32 start_timeout_ms = 4;
  optional int32 resume_timeout_ms = 5;
}