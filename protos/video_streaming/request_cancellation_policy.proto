syntax = "proto2";
package video_streaming;

message RequestCancellationPolicy {
  message RequestCancellationPolicyItem {
    optional int32 unknown_field_1 = 1;
    optional int32 unknown_field_2 = 2;
    optional int32 min_readahead_ms = 3;
  }

  optional int32 policy_enforcement_interval_ms = 1;
  repeated RequestCancellationPolicyItem items = 2;
  optional int32 no_data_timeout_ms = 3;
}