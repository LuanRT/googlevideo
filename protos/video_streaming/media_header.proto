syntax = "proto2";
package video_streaming;

import "misc/common.proto";
import "video_streaming/time_range.proto";

message MediaHeader {
  optional uint32 header_id = 1;
  optional string video_id = 2;
  optional int32 itag = 3;
  optional uint64 lmt = 4;
  optional string xtags = 5;
  optional int64 segment_byte_range_start = 6;
  optional .misc.CompressionType compression_type = 7;
  optional bool is_initialization_segment = 8;
  optional int32 segment_num = 9;
  optional int64 bitrate_bps = 10;
  optional int64 start_ms = 11;
  optional int64 duration_ms = 12;
  optional .misc.FormatId format_id = 13;
  optional int64 segment_length_bytes = 14;
  optional TimeRange time_range = 15;
  optional uint64 segment_lmt = 16;
  optional int64 offset_from_start_of_segment = 17; // @TODO: unsure if this is 17
  optional int64 partial_bytes_to_return = 18; // @TODO: unsure if this is 18
}
